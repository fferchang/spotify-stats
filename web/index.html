<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Vinilo · tus estadísticas de Spotify</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23141715'/><circle cx='16' cy='16' r='9.5' fill='none' stroke='%233ddc84' stroke-width='1.6'/><circle cx='16' cy='16' r='3.2' fill='%233ddc84'/></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<a class="skip-link" href="#main">Saltar al contenido</a>

<div class="shell">

  <!-- ─────────────────────────────  Navegación  ───────────────────────────── -->
  <nav class="nav" aria-label="Secciones">
    <div class="nav__brand">
      <svg class="nav__disc" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".35"/>
        <circle cx="16" cy="16" r="9.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
      </svg>
      <span>Vinilo</span>
    </div>

    <ul class="nav__list" id="navList"></ul>

    <div class="nav__foot">
      <div class="nav__enrich" id="enrichWidget" hidden></div>
      <p class="nav__note">Todo se calcula en tu máquina.<br>Nada de esto sale de acá.</p>
    </div>
  </nav>

  <!-- ─────────────────────────────  Contenido  ───────────────────────────── -->
  <div class="body">

    <header class="filters" id="filters">
      <div class="filters__row">
        <div class="chips" role="group" aria-label="Período" id="periodChips"></div>

        <div class="filters__right">
          <div class="seg" role="group" aria-label="Ordenar por">
            <button type="button" class="seg__btn" data-sort="plays">Reproducciones</button>
            <button type="button" class="seg__btn" data-sort="ms">Tiempo</button>
          </div>
          <button type="button" class="btn btn--ghost" id="customBtn" aria-expanded="false">
            <svg viewBox="0 0 16 16" aria-hidden="true" class="ico"><path d="M5 1v2M11 1v2M2 6h12M3 3h10a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            Fechas
          </button>
        </div>
      </div>

      <div class="daterange" id="daterange" hidden>
        <label>Desde <input type="date" id="dateFrom"></label>
        <label>Hasta <input type="date" id="dateTo"></label>
        <button type="button" class="btn btn--primary" id="applyRange">Aplicar</button>
        <button type="button" class="btn btn--ghost" id="clearRange">Limpiar</button>
        <p class="daterange__hint" id="rangeHint"></p>
      </div>
    </header>

    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>

<!-- ─────────────────────────────  Panel de detalle  ───────────────────────────── -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close-sheet></div>
  <aside class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button type="button" class="sheet__close" data-close-sheet aria-label="Cerrar">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div class="sheet__body" id="sheetBody"></div>
  </aside>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
